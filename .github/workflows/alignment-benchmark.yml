name: Alignment benchmark
on:
  push:
    branches: [main]
    paths: ['benchmark/**', '.github/workflows/alignment-benchmark.yml']
  pull_request:
    paths: ['benchmark/**', '.github/workflows/alignment-benchmark.yml']
  workflow_dispatch:
    inputs:
      live:
        description: 'Opt in to real model execution (may use Gemini quota/download model weights)'
        type: boolean
        default: false
      provider:
        description: 'Which provider to run (all runs all three)'
        type: choice
        default: gemini
        options:
          - gemini
          - gemini-lexialign
          - simalign
          - all
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test scoring and adapter contracts (no API)
        run: python -m unittest discover -s benchmark -p 'test_*.py' -v
      - name: Validate benchmark dataset
        run: python benchmark/runner.py --validate-only
  opt-in-live:
    if: github.event_name == 'workflow_dispatch' && inputs.live == true
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BENCHMARK_PROVIDER: ${{ inputs.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Gemini secret for LLM providers
        if: inputs.provider != 'simalign'
        run: test -n "$GEMINI_API_KEY" || { echo 'Missing repository GEMINI_API_KEY secret'; exit 1; }
      - name: Install LexiAlign only when selected
        if: inputs.provider == 'gemini-lexialign' || inputs.provider == 'all'
        run: python -m pip install -r benchmark/requirements-lexialign.txt
      - name: Install SimAlign only when selected
        if: inputs.provider == 'simalign' || inputs.provider == 'all'
        run: python -m pip install -r benchmark/requirements-simalign.txt
      - name: Run real alignment benchmark
        run: python benchmark/runner.py --provider "$BENCHMARK_PROVIDER" --output benchmark/results/live.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alignment-benchmark-results
          path: benchmark/results/
          if-no-files-found: ignore
